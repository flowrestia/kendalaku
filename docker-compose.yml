version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kendalaku_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-kendalaku_db}
      MYSQL_USER: ${DB_USER:-kendalaku_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kendalaku_pass}
      TZ: UTC
    ports:
      - "${DB_PORT:-3307}:3307"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --explicit_defaults_for_timestamp=true
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kendalaku_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kendalaku_backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: mysql
      DB_PORT: 3307
      DB_USER: ${DB_USER:-kendalaku_user}
      DB_PASSWORD: ${DB_PASSWORD:-kendalaku_pass}
      DB_NAME: ${DB_NAME:-kendalaku_db}
      JWT_SECRET: ${JWT_SECRET:-kendalaku_jwt_super_secret_key_2026}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
    networks:
      - kendalaku_net

volumes:
  mysql_data:
    driver: local

networks:
  kendalaku_net:
    driver: bridge
